version: 1
name: editorial-charting-color-system
intent: >
  A high-contrast, Bloomberg-inspired data visualization color system for
  editorial charts. This is an internal inspired palette, not an official
  Bloomberg style guide.

base_palette:
  blue: "#0B5FFF"
  cyan: "#00AEEF"
  green: "#00A66A"
  yellow: "#F8C300"
  orange: "#FF6B00"
  red: "#E23D3D"
  magenta: "#E20074"
  violet: "#7B61FF"
  slate: "#334155"

neutral_grays:
  ink: "#111827"
  text: "#1F2937"
  muted_text: "#6B7280"
  grid: "#E5E7EB"
  axis: "#9CA3AF"
  background: "#FFFFFF"
  panel: "#F8FAFC"
  missing_data: "#D1D5DB"

default_roles:
  main_claim: "shade_ramps.blue.1.0"
  secondary_emphasis: "shade_ramps.blue.0.85"
  comparison: "shade_ramps.blue.0.55"
  context: "shade_ramps.blue.0.2"
  muted_series: "neutral_grays.missing_data"
  gridline: "neutral_grays.grid"
  text: "neutral_grays.text"

shade_usage:
  "0.1": "Very light background bands or map bins; avoid for small marks."
  "0.2": "Muted context series, history, non-focus bars, and reference ranges."
  "0.3": "Low-emphasis comparison when labels carry the exact value."
  "0.4": "Secondary background comparison."
  "0.5": "Middle value in ordered bins."
  "0.55": "Default comparison emphasis."
  "0.6": "Readable supporting mark for medium-size bars or areas."
  "0.7": "Strong supporting mark."
  "0.8": "High emphasis, but not the primary claim."
  "0.85": "Default secondary emphasis."
  "0.9": "Near-primary emphasis."
  "1.0": "Primary claim, highlight, or selected series."

