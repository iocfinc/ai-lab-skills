categorical_order:
  default: [blue, orange, green, magenta, cyan, red, violet, yellow, slate]
  caution: >
    Use categorical colors only when categories are truly unordered. For
    emphasis charts, prefer one hue plus shades.

rules:
  - Use one hue plus shades when the chart has a single editorial focus.
  - Use neutral grays for non-data furniture: axes, gridlines, notes, and sources.
  - Avoid rainbow palettes for ordered values; use shade ramps or a tested gradient.
  - Check colorblind legibility when hue alone carries meaning.
  - Do not encode positive and negative with red and green unless the audience expects it.
